<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PMR — NO SIGNAL</title>
  <!--
    Offline fallback for the native app shell. The app normally loads
    the live site; this page only appears when the phone truly has no
    connection. Styled like a dead channel, obviously.
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #000000;
      color: #e8e6e3;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    .screen {
      position: relative;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      text-align: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at center, #101013 0%, #000000 75%);
    }
    /* static noise */
    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.18;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 160px 160px;
      animation: shift 0.4s steps(2) infinite;
    }
    @keyframes shift {
      0% { background-position: 0 0; }
      50% { background-position: -30px 15px; }
      100% { background-position: 0 0; }
    }
    /* scanlines */
    .screen::after {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,0,0,0.14) 2px, rgba(0,0,0,0.14) 4px
      );
      pointer-events: none;
    }
    h1 {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: #2fff5e;
      text-shadow: 0 0 8px rgba(47,255,94,0.8), 0 0 24px rgba(47,255,94,0.35);
      font-family: "Courier New", monospace;
      z-index: 1;
    }
    p { color: #9a9a9e; font-size: 15px; max-width: 300px; z-index: 1; }
    button {
      z-index: 1;
      margin-top: 6px;
      padding: 12px 28px;
      border-radius: 999px;
      border: 2px solid #1e90ff;
      background: #1e90ff;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      box-shadow: 0 3px 0 #1570c8, 0 0 24px rgba(30,144,255,0.35);
    }
    button:active { transform: translateY(2px); box-shadow: 0 1px 0 #1570c8; }
  </style>
</head>
<body>
  <div class="screen">
    <h1>NO SIGNAL</h1>
    <p>Peak Music Reviews can't find a connection. Check your service and smack the side of the TV.</p>
    <button onclick="window.location.href='https://peakmusicreviews.com'">Retune</button>
  </div>
</body>
</html>
